name: CI/CD Pipeline - Data Engineering Quality Gate

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Set up Java 17 (Required for PySpark testing)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter (Python Code Quality)
        run: |
          ruff check .

      - name: Run SQLFluff Linter (dbt & SQL Modeling Standards)
        run: |
          sqlfluff lint dbt_project/models/

      - name: Run PyTest Test Suite (Data Generator & Spark Transforms)
        run: |
          pytest tests/ --verbose
